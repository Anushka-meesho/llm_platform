# POST /v1/tasks/{task_id}/versions/{version}/eval — run one prompt version
# against a stored eval dataset.
$schema: "https://json-schema.org/draft/2020-12/schema"
title: Run eval request
type: object
additionalProperties: false
required: [dataset_id]
properties:
  dataset_id:
    type: integer
    minimum: 1
  max_items:
    type: integer
    minimum: 1
    maximum: 200
  model:
    type: string
    minLength: 1
