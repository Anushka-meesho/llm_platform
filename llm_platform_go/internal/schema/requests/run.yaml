# POST /run — multi-model Compare playground. Mirrors types.RunRequest.
$schema: "https://json-schema.org/draft/2020-12/schema"
title: Run request
type: object
additionalProperties: false
required: [prompt]
properties:
  prompt:
    type: string
    minLength: 1
  models:
    type: array
    items: { type: string }
  model_conversations:
    type: object
    additionalProperties:
      type: array
      items:
        type: object
        required: [role]
        properties:
          role: { type: string }
          content: {} # string or multimodal array
  temperature:
    type: number
    minimum: 0
    maximum: 2
  max_tokens:
    type: integer
    minimum: 1
  session_id:
    type: string
  system_prompt:
    type: string
  # Optional structured-output preference, forwarded to each model as the
  # OpenAI-compatible response_format. Best-effort: a model that rejects it
  # answers with a plain call instead (see llm.CallModel).
  response_format:
    type: object
    required: [type]
    additionalProperties: false
    properties:
      type:
        type: string
        enum: [json_object, json_schema]
      json_schema:
        type: object
        required: [name, schema]
        properties:
          name: { type: string }
          schema: { type: object }
          strict: { type: boolean }
