# POST /v1/shadow/compare — run labelled items through a task and measure
# field-level agreement + latency.
$schema: "https://json-schema.org/draft/2020-12/schema"
title: Shadow compare request
type: object
additionalProperties: false
required: [task_id, items]
properties:
  task_id:
    type: string
    minLength: 1
  items:
    type: array
    minItems: 1
    maxItems: 200 # shadowMaxItems
    items:
      type: object
      additionalProperties: false
      required: [inputs]
      properties:
        inputs:
          type: object
        expected_output: {} # any JSON; field-level comparison target
